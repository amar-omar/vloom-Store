<div class="flex min-h-screen flex-col items-center justify-center px-3 sm:px-6 py-6">
  <!-- Address -->
  <h1 class="text-3xl sm:text-5xl font-bold tracking-tight mb-4 text-center">SIGN IN</h1>

  <!-- Form -->
  <form #loginForm="ngForm" (ngSubmit)="signIn()" class="w-full max-w-[500px] px-2">

    <!--   Email -->
    <div class="mb-5 flex flex-col gap-1.5">
      <label for="email" class="font-bold text-xs sm:text-sm text-gray-800">Your Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required email autocomplete="email"
        class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-black focus:ring-1 focus:ring-black transition"
        placeholder="Enter Your Email" />
    </div>

    <!--   Password -->
    <div class="mb-6 flex flex-col gap-1.5">
      <div class="flex items-center justify-between gap-2">
        <label for="password" class="font-bold text-xs sm:text-sm text-gray-800">Your password</label>
      </div>
      <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password"
        class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-black focus:ring-1 focus:ring-black transition"
        placeholder="Enter Your Password" />
    </div>

    @if (errorMessage()) { <p class="mb-4 text-sm text-red-700" role="alert">{{ errorMessage() }}</p> }

    <!--   Login Button  -->
    <button type="submit" [disabled]="signingIn() || loginForm.invalid"
      class="w-full bg-black text-white py-3.5 rounded-lg font-bold text-sm sm:text-base cursor-pointer transition hover:bg-gray-800 shadow-sm disabled:opacity-50">
      {{ signingIn() ? 'SIGNING IN...' : 'SIGN IN' }}
    </button>

    <!-- Don't have an account? -->
    <div class="text-center mt-4">
      <a class="block w-full bg-gray-100 hover:bg-gray-200 text-black py-3 rounded-lg font-bold text-xs sm:text-sm cursor-pointer transition border border-gray-200"
        routerLink="/auth/register">
        Don't have an account? <span class="underline">CREATE ONE</span>
      </a>
    </div>
    <div class="text-center mt-4"><a routerLink="/main/home" class="text-sm underline">Continue shopping as a guest</a></div>

  </form>
</div>
